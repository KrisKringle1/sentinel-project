name: Sentinel CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven

      - name: Build and verify with Maven
        run: ./mvnw clean verify -B

      - name: Validate Docker Compose configuration
        run: KAFKA_CLUSTER_ID=ci-test-cluster docker compose config -q

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sentinel-dashboard
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: sentinel-dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck, lint, test, and build Next.js dashboard
        run: |
          npm run typecheck
          npm run lint
          npm run test
          npm run build
