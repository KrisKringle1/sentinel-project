spring:
  application:
    name: sentinel-ingestion-service
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      # Use String for the Key (e.g., Device ID)
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      # Use Avro for the Value (The actual metric payload)
      value-serializer: io.confluent.kafka.serializers.KafkaAvroSerializer
      acks: all
      retries: 5
      properties:
        # The URL where your Schema Registry container is listening
        schema.registry.url: http://localhost:8085
        # STAFF LEVEL CONFIG: Idempotence
        # Ensures that even if the network flickers, we don't send duplicate metrics.
        enable.idempotence: true

server:
  port: 8080

logging:
  level:
    com.sentinel.ingestion: DEBUG

sentinel:
  ingestion:
    topic:
      metrics: service-metrics
      metrics-dlq: service-metrics-dlq

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
